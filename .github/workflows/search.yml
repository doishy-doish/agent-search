name: direct-stream-search
on:
  workflow_dispatch:
    inputs:
      stream:
        description: "Stream: bot (GitHub escrow-bot actor) or base (Base RPC logs)"
        default: "bot"
        required: true
      target:
        description: "Bot app short name (e.g. bountic-bot) or contract address"
        default: "bountic-bot"
        required: true
      limit:
        description: "Max results"
        default: "10"
        required: true
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run direct stream
        env:
          SEARCH_STREAM: ${{ inputs.stream }}
          SEARCH_TARGET: ${{ inputs.target }}
          SEARCH_LIMIT: ${{ inputs.limit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 search.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: search-results
          path: results/results.json
      - name: report back
        if: always()
        run: |
          git config user.name "agent-search"
          git config user.email "agent-search@local"
          git add results/ || true
          git commit -m "run ${{ github.run_id }} report" || true
          git push --force origin HEAD:runs || true
