name: direct-stream-search
on:
  workflow_dispatch:
    inputs:
      stream:
        description: "Stream: bot (GitHub escrow-bot actors) or base (Base RPC logs)"
        default: "bot"
        required: true
      target:
        description: "Comma watchlist: bot app short names or contract addresses"
        default: "bountic-bot,bountyhub-app,opire,algora-io,gitwork-io"
        required: true
      limit:
        description: "Max results per target"
        default: "10"
        required: true
  schedule:
    - cron: "*/15 * * * *"
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run direct stream
        env:
          SEARCH_STREAM: ${{ inputs.stream || 'bot' }}
          SEARCH_TARGET: ${{ inputs.target || 'bountic-bot,bountyhub-app,opire,algora-io,gitwork-io' }}
          SEARCH_LIMIT: ${{ inputs.limit || '10' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 search.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: search-results
          path: results/results.json
      - name: report back
        if: always()
        run: |
          git config user.name "agent-search"
          git config user.email "agent-search@local"
          git add results/ || true
          git commit -m "run ${{ github.run_id }} report" || true
          git push --force origin HEAD:runs || true
